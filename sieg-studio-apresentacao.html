  SIEG Studio · Editor de apresentações (Apresentação modelo 1)
  Cole este bloco inteiro em um bloco "HTML personalizado" (Gutenberg) ou no widget "HTML" (Elementor),
  numa página própria do WordPress.

  - ?marca=institucional | academy | endomarketing escolhe qual apresentação abre.
  - data-gallery-url: endereço da página da galeria do SIEG Studio (para o link "Todos os templates").
  - As edições ficam salvas no navegador de cada pessoa até ela clicar em "Restaurar modelo".
  - Os textos são preenchidos pelo formulário do painel; no slide, os elementos podem ser arrastados.
  - Dá para adicionar, duplicar, reordenar e excluir slides.
  - Desfazer / Refazer (Ctrl+Z / Ctrl+Shift+Z) valem para posições dos elementos e para as mudanças nos slides.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<div class="ss-apres" id="ss-apres" data-gallery-url="index.html">
  <section class="ss-editor">
    <aside class="ss-panel">
      <a class="ss-back" href="#">

      <p class="ss-brandlabel"></p>
      <h2 class="ss-piece-title">Apresentação modelo 1</h2>
      <p class="ss-when"></p>

      <div class="ss-slidebar">
        <span class="ss-slidecount" aria-live="polite"></span>
        <button type="button" class="ss-reset">Restaurar modelo</button>
      </div>

        <button type="button" class="ss-tool is-primary" data-slide="novo" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Novo slide</button>
        <button type="button" class="ss-tool ss-tool-icon" data-slide="duplicar" aria-label="Duplicar slide" title="Duplicar slide"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button>
        <span class="ss-tools-sep"></span>
        <button type="button" class="ss-tool ss-tool-icon" data-slide="subir" aria-label="Mover slide para antes" title="Mover para antes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg></button>
        <button type="button" class="ss-tool ss-tool-icon" data-slide="descer" aria-label="Mover slide para depois" title="Mover para depois"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
        <button type="button" class="ss-tool ss-tool-icon is-danger" data-slide="excluir" aria-label="Excluir slide" title="Excluir slide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
        <div class="ss-layouts" role="group" aria-label="Escolha o layout do novo slide" hidden></div>
      </div>
      <div class="ss-undo" role="status" hidden>
        <span class="ss-undo-text"></span>
        <button type="button" class="ss-undo-btn">Desfazer</button>
      </div>

      <div class="ss-fields" aria-label="Textos do slide"></div>

      <div class="ss-drop" tabindex="0" role="button">
        <input type="file" accept="image/png,image/jpeg,image/webp" class="ss-file-hidden" tabindex="-1" aria-hidden="true">
        <div class="ss-drop-empty">
          <span class="ss-drop-title">Inserir elemento</span>
          <span class="ss-drop-hint"></span>
        </div>
        <div class="ss-drop-filled" hidden>
          <img alt="Imagem inserida no slide">
          <div class="ss-drop-actions">
            <button type="button" data-drop="trocar">Trocar</button>
            <button type="button" data-drop="remover">Remover</button>
          </div>
        </div>
      </div>
      <p class="ss-drop-error" role="alert" hidden></p>

      <div class="ss-export">
        <label class="ss-format">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v12M7 12.5l5 5 5-5"/></svg>
          <span class="ss-sr">Formato do arquivo</span>
          <select>
            <option value="pdf">PDF</option>
            <option value="png">PNG</option>
          </select>
        </label>
        <button type="button" class="ss-export-btn">Exportar</button>
      </div>
      <p class="ss-export-hint"></p>
    </aside>

    <div class="ss-stage">
      <div class="ss-frame"><div class="ss-host ss-deck"></div></div>
      <div class="ss-stagebar">
        <div class="ss-hist" role="group" aria-label="Histórico">

        </div>
        <div class="ss-pager">
          <button type="button" data-go="-1" aria-label="Slide anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6"/></svg></button>
          <span class="ss-pager-n"></span>
          <button type="button" data-go="1" aria-label="Próximo slide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg></button>
        </div>
        <button type="button" class="ss-pos-reset">Restaurar posições do slide</button>
      </div>
      <p class="ss-stage-hint">Arraste um elemento para mudar a posição; com ele selecionado, as setas ajustam com precisão. Clique num texto para editá-lo no painel.</p>
    </div>

    <nav class="ss-rail" aria-label="Slides">
      <div class="ss-variants"></div>
    </nav>
  </section>
</div>

.ss-apres{
  --ss-bg:#f2f4f8;--ss-ink:#040426;--ss-ink-2:#3a3f4b;--ss-muted:#8a8f99;
  --ss-accent:#005fe9;--ss-accent-dark:#040426;
  --ss-glass:linear-gradient(160deg,#f9fafc 0%,#eceff4 52%,#f7f8fa 100%);
  font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ss-ink);background:var(--ss-bg);padding:clamp(20px,3vw,48px);line-height:1.4;
  -webkit-font-smoothing:antialiased;
}
.ss-apres *,.ss-apres *::before,.ss-apres *::after{box-sizing:border-box}
.ss-apres [hidden]{display:none!important}
.ss-apres .ss-ui svg,.ss-apres .ss-panel svg,.ss-apres .ss-pager svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ss-apres button,.ss-apres input,.ss-apres select,.ss-apres textarea{font:inherit;color:inherit;letter-spacing:normal;text-transform:none;box-shadow:none;margin:0}
.ss-apres button{cursor:pointer;border:0;background:none;padding:0;border-radius:0;line-height:1.2}
.ss-apres a{text-decoration:none;color:inherit}
.ss-apres h2,.ss-apres p{margin:0}
.ss-apres :focus-visible{outline:3px solid var(--ss-accent);outline-offset:3px}
.ss-apres .ss-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.ss-apres .ss-editor{
  display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr) 48px;gap:clamp(24px,3.5vw,56px);
  height:min(880px,calc(100vh - 96px));min-height:640px;align-items:stretch;
}
.ss-apres .ss-editor>*{min-width:0;min-height:0}

.ss-apres .ss-panel{
  display:flex;flex-direction:column;padding:26px 22px 22px;border-radius:18px;background:var(--ss-glass);
  border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 1px 0 #fff,0 12px 32px rgba(18,28,60,.07);
}
.ss-apres .ss-back{display:inline-flex;align-items:center;gap:4px;font-size:14px;color:var(--ss-ink-2);margin:-6px 0 16px -6px;padding:4px 8px 4px 2px;border-radius:8px;align-self:flex-start}
.ss-apres .ss-back svg{width:18px;height:18px}
.ss-apres .ss-back:hover{color:var(--ss-accent)}
.ss-apres .ss-brandlabel{font-size:15px}
.ss-apres .ss-piece-title{font-size:clamp(28px,2.4vw,40px);font-weight:400;line-height:1.12;color:var(--ss-accent);margin:6px 0 8px;letter-spacing:-.01em}
.ss-apres .ss-when{font-size:14px;color:var(--ss-ink-2);margin-bottom:22px}

.ss-apres .ss-slidebar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.ss-apres .ss-slidecount{font-size:14px;font-weight:600;color:var(--ss-ink-2)}
.ss-apres .ss-reset{font-size:13px;color:var(--ss-muted);text-decoration:underline;text-underline-offset:3px}
.ss-apres .ss-reset:hover{color:var(--ss-accent)}
.ss-apres .ss-reset.is-confirm{color:#b42318;text-decoration:none;font-weight:600}

.ss-apres .ss-panel{position:relative}
.ss-apres .ss-slidetools{position:relative;display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ss-apres .ss-tool{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 12px;border-radius:999px;font-size:14px;background:#fff;border:1px solid #dde0e6;color:var(--ss-ink-2)}
.ss-apres .ss-tool svg{width:16px;height:16px;flex:none}
.ss-apres .ss-tool:hover{border-color:var(--ss-accent);color:var(--ss-accent)}
.ss-apres .ss-tool.is-primary{background:var(--ss-accent);border-color:var(--ss-accent);color:#fff}
.ss-apres .ss-tool.is-primary:hover{filter:brightness(1.08);color:#fff}
.ss-apres .ss-tool-icon{width:34px;padding:0;justify-content:center}
.ss-apres .ss-tool.is-danger:hover{color:#b42318;border-color:#f3b8b2;background:#fdecea}
.ss-apres .ss-tool[disabled]{opacity:.35;cursor:default;border-color:#dde0e6;color:var(--ss-ink-2);background:#fff}
.ss-apres .ss-tools-sep{flex:1}
.ss-apres .ss-layouts{position:absolute;z-index:20;top:42px;left:0;right:0;display:grid;grid-template-columns:repeat(2,120px);justify-content:center;gap:8px;max-height:340px;overflow-y:auto;padding:12px;border-radius:14px;background:#fff;border:1px solid #dde0e6;box-shadow:0 18px 40px rgba(18,28,60,.18)}
.ss-apres .ss-layout{position:relative;display:block;width:120px;height:67.5px;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px #dde0e6}
.ss-apres .ss-layout:hover,.ss-apres .ss-layout:focus-visible{box-shadow:0 0 0 2px var(--ss-accent);outline:0}
.ss-apres .ss-layout .ss-deck{position:absolute;left:0;top:0;width:1920px;height:1080px;transform:scale(calc(120 / 1920));transform-origin:0 0;pointer-events:none}
.ss-apres .ss-undo{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-4px 0 12px;padding:10px 14px;border-radius:12px;background:var(--ss-ink);color:#fff;font-size:14px;flex:none}
.ss-apres .ss-undo-btn{color:#fff;font-weight:600;text-decoration:underline;text-underline-offset:3px;font-size:14px}

.ss-apres .ss-fields{flex:1 1 auto;min-height:120px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin:0 -6px 18px;padding:2px 6px 6px}
.ss-apres .ss-field{
  display:flex;align-items:flex-start;gap:8px;padding:9px 14px;border-radius:20px;
  background:linear-gradient(95deg,#e8eaef 0%,#f6f7f9 60%,#fafbfc 100%);border:1px solid rgba(255,255,255,.95);
  box-shadow:inset 0 1px 2px rgba(18,28,60,.05);cursor:text;flex:none;
}
.ss-apres .ss-field span{font-size:14px;line-height:22px;color:var(--ss-ink);flex:none}
.ss-apres .ss-field textarea{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:0;font-size:14px;line-height:22px;color:var(--ss-ink-2);resize:none;overflow:hidden;height:22px;display:block}
.ss-apres .ss-field:focus-within{box-shadow:0 0 0 2px var(--ss-accent)}
.ss-apres .ss-fields-empty{font-size:14px;color:var(--ss-muted)}

.ss-apres .ss-drop{
  position:relative;min-height:120px;border-radius:14px;border:1px solid #c7cad2;flex:none;
  background:radial-gradient(120% 90% at 50% 50%,#f6f7f9 0%,#eceef2 100%);
  display:grid;place-items:center;text-align:center;cursor:pointer;padding:14px;transition:border-color .15s;
}
.ss-apres .ss-drop:hover{border-color:var(--ss-accent)}
.ss-apres .ss-drop.is-over{border:2px dashed var(--ss-accent);background:#fff}
.ss-apres .ss-drop.is-off{cursor:default;opacity:.7}
.ss-apres .ss-drop.is-off:hover{border-color:#c7cad2}
.ss-apres .ss-drop-empty{display:flex;flex-direction:column;gap:6px}
.ss-apres .ss-drop-title{font-size:16px}
.ss-apres .ss-drop-hint{font-size:13px;color:var(--ss-muted)}
.ss-apres .ss-drop-hint button{color:var(--ss-accent);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.ss-apres .ss-drop-filled{display:flex;align-items:center;gap:12px;width:100%}
.ss-apres .ss-drop-filled img{width:96px;height:64px;border-radius:6px;object-fit:cover;flex:none}
.ss-apres .ss-drop-actions{display:flex;gap:8px;flex-wrap:wrap}
.ss-apres .ss-drop-actions button{padding:6px 12px;border-radius:999px;font-size:13px;background:#fff;border:1px solid #dde0e6}
.ss-apres .ss-drop-actions button:hover{border-color:var(--ss-accent);color:var(--ss-accent)}
.ss-apres .ss-file-hidden{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
.ss-apres .ss-drop-error{font-size:13px;color:#b42318;margin-top:8px}

.ss-apres .ss-export{display:flex;align-items:center;gap:10px;padding-top:18px;flex:none}
.ss-apres .ss-format{position:relative;display:flex;align-items:center;height:40px;padding:0 10px 0 8px;border-radius:999px;background:linear-gradient(95deg,#e8eaef,#f8f9fb);border:1px solid rgba(255,255,255,.95)}
.ss-apres .ss-format svg{width:16px;height:16px;color:var(--ss-muted);flex:none}
.ss-apres .ss-format select{appearance:none;-webkit-appearance:none;border:0;outline:0;background:transparent;padding:0 4px;font-size:18px;height:100%;cursor:pointer}
.ss-apres .ss-format:focus-within{box-shadow:0 0 0 2px var(--ss-accent)}
.ss-apres .ss-export-btn{height:40px;padding:0 16px;border-radius:999px;background:var(--ss-accent);color:#fff;font-size:18px}
.ss-apres .ss-export-btn:hover{filter:brightness(1.08)}
.ss-apres .ss-export-btn[disabled]{opacity:.6;cursor:progress}
.ss-apres .ss-export-hint{font-size:12px;color:var(--ss-muted);margin-top:8px;min-height:1em}

.ss-apres .ss-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.ss-apres .ss-frame{position:relative;overflow:hidden;border-radius:10px;box-shadow:0 18px 40px rgba(18,28,60,.14);background:#fff;flex:none}

.ss-apres .ss-hist button:hover{background:rgba(0,0,0,.06);color:var(--ss-ink)}
.ss-apres .ss-hist button[disabled]{opacity:.3;cursor:default;background:none}
.ss-apres .ss-hist svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ss-apres .ss-pos-reset{font-size:13px;color:var(--ss-muted);text-decoration:underline;text-underline-offset:3px}

.ss-apres .ss-pos-reset[disabled]{opacity:.5;cursor:default;color:var(--ss-muted)}
.ss-apres .ss-stage-hint{font-size:13px;color:var(--ss-muted);text-align:center;margin-top:-4px}
.ss-apres .ss-pager{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ss-ink-2)}
.ss-apres .ss-pager button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.ss-apres .ss-pager button:hover{background:rgba(0,0,0,.06)}
.ss-apres .ss-pager button[disabled]{opacity:.3;cursor:default}
.ss-apres .ss-pager svg{width:18px;height:18px}

.ss-apres .ss-rail{position:relative;border-radius:16px;background:var(--ss-glass);border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 1px 0 #fff,0 12px 32px rgba(18,28,60,.06)}
.ss-apres .ss-variants{position:absolute;top:50%;left:-44px;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;max-height:100%;overflow-y:auto;padding:4px}
.ss-apres .ss-thumb{position:relative;display:block;width:80px;height:45px;border-radius:3px;overflow:hidden;flex:none;transition:box-shadow .15s}
.ss-apres .ss-thumb:hover{box-shadow:0 0 0 2px #fff}
.ss-apres .ss-thumb[aria-current="true"]{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ss-accent)}
.ss-apres .ss-thumb .ss-deck{position:absolute;left:0;top:0;width:1920px;height:1080px;transform:scale(calc(80 / 1920));transform-origin:0 0;pointer-events:none}

/* Reset mínimo dentro dos slides (protege o layout contra estilos do tema do WordPress) */

.ss-deck img{max-width:none;height:auto;border-radius:0;box-shadow:none}
.ss-deck ul{list-style:disc}
.ss-deck li{margin:0;padding:0}
.ss-deck .ss-hl{outline:6px solid var(--ss-accent-edit,#67a0fa)!important;outline-offset:8px}

.ss-deck [data-ss-img].has-img>*{visibility:hidden}
.ss-host{touch-action:none}

.ss-host,.ss-host *{user-select:none;-webkit-user-select:none}

@media (max-width:980px){

  .ss-apres .ss-variants{position:static;transform:none;flex-direction:row;overflow-x:auto;max-height:none}

}

  #ss-print .ss-page{width:1920px;height:1080px;overflow:hidden;break-after:page;page-break-after:always;position:relative}

  #ss-print *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){.ss-apres *,.ss-deck *{transition:none!important}}

<script>
(function () {
  var root = document.getElementById('ss-apres');
  if (!root || root.dataset.ready) return;
  root.dataset.ready = '1';

  // Fonte dos slides. O Brand Space define Figtree para todas as criações, inclusive slides.
  // Para voltar à fonte original dos modelos, troque por '' (vazio).
  var FONTE_SLIDES = 'Figtree';

  var MARCAS = {
    institucional: { nome: 'SIEG Institucional', cor: '#005fe9', edicao: '#67a0fa', quando: 'Reuniões com clientes, parceiros e eventos externos.' },
    academy:       { nome: 'SIEG Academy',       cor: '#0093e9', edicao: '#5cc3ff', quando: 'Aulas, trilhas e treinamentos do SIEG Academy.' },
    endomarketing: { nome: 'SIEG Endomarketing', cor: '#6f2abe', edicao: '#b98cf0', quando: 'Reuniões internas, comunicados e campanhas para o time.' }
  };

  var $ = function (s, el) { return (el || root).querySelector(s); };
  var $$ = function (s, el) { return Array.prototype.slice.call((el || root).querySelectorAll(s)); };

  var params = new URLSearchParams(location.search);
  var marcaId = MARCAS[params.get('marca')] ? params.get('marca') : 'institucional';
  var marca = MARCAS[marcaId];
  var fonte = document.querySelector('template[data-ss-deck="' + marcaId + '"]');
  if (!fonte) return;

  root.style.setProperty('--ss-accent', marca.cor);
  root.style.setProperty('--ss-accent-edit', marca.edicao);
  $('.ss-brandlabel').textContent = marca.nome;
  $('.ss-when').textContent = 'Quando usar: ' + marca.quando;
  var galeria = root.dataset.galleryUrl || '';
  $('.ss-back').href = galeria + (galeria.indexOf('?') >= 0 ? '&' : '?') + 'marca=' + marcaId;
  try { document.title = 'Apresentação modelo 1 | ' + marca.nome; } catch (e) {}

  /* ---------- Slides ---------- */
  // Cada slide da apresentação vem de um modelo (layout) do <template>. A pessoa pode
  // adicionar, duplicar, reordenar e excluir slides, e mover os elementos de cada um.
  var modelos = Array.prototype.slice.call(fonte.content.children);
  var NM = modelos.length;
  var CHAVE = 'ss-apres-' + marcaId;

  function uid() { return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function lerSalvo() {
    var s;
    try { s = JSON.parse(localStorage.getItem(CHAVE)); } catch (e) {}
    if (s && s.v === 2 && Array.isArray(s.slides)) {
      var ok = s.slides.filter(function (d) { return d && d.src >= 0 && d.src < NM; });
      if (ok.length) {
        ok.forEach(function (d) { d.t = d.t || {}; d.p = d.p || {}; d.img = d.img || ''; d.id = d.id || uid(); });
        return { v: 2, slides: ok };
      }
    }
    // Formato antigo ({ t: {i: {...}}, img: {i: url} }, um slide por modelo) ou nada salvo
    var t = (s && s.t) || {}, img = (s && s.img) || {};
    return { v: 2, slides: modelos.map(function (_, i) { return { id: 'm' + i, src: i, t: t[i] || {}, img: img[i] || '', p: {} }; }) };
  }
  var salvo = lerSalvo();
  var timerSalvar;
  function salvar() {
    clearTimeout(timerSalvar);
    timerSalvar = setTimeout(function () {
      try { localStorage.setItem(CHAVE, JSON.stringify(salvo)); }
      catch (e) { $('.ss-export-hint').textContent = 'Não foi possível salvar as edições neste navegador. Exporte antes de sair.'; }
    }, 250);
  }

  function ehRodape(el) { var f = el.closest('[data-frame-id]'); return !!f && f.style.bottom === '56px'; }

  // Monta o DOM de um slide a partir do modelo e das edições salvas (d)
  function montarSlide(d) {
    var slide = modelos[d.src].cloneNode(true);
    if (FONTE_SLIDES) {
      $$('[style*="font-family"]', slide).forEach(function (el) {
        if (el.style.fontFamily.indexOf('Plus Jakarta Sans') >= 0) el.style.fontFamily = '"' + FONTE_SLIDES + '", Arial, sans-serif';
      });
    }
    var lista = [];
    $$('[data-text-path]', slide).forEach(function (el) {
      if (ehRodape(el)) return; // rodapé fixo (marca e número)
      var txt = el.textContent.trim();
      if (/^\[?Insira uma imagem/i.test(txt)) {
        var area = el.parentElement;
        area.setAttribute('data-ss-img', '');
        area.setAttribute('data-ss-move', '');
        area.setAttribute('role', 'button');
        area.setAttribute('aria-label', 'Inserir imagem neste slide');
        return;
      }
      el.setAttribute('data-ss-move', '');
      var ul = el.querySelector('ul');
      if (ul) {
        $$('li', ul).forEach(function (li, k) { lista.push({ el: li, chave: el.dataset.textPath + '.li' + k, rotulo: 'Destaque' }); });
      } else {
        lista.push({ el: el, chave: el.dataset.textPath, rotulo: rotuloDe(el, txt) });
      }
    });
    // Ícones e quadros decorativos (logo, grafismo) também podem ser movidos
    $$('[data-icon-path]', slide).forEach(function (el) {
      if (!ehRodape(el) && !el.closest('[data-ss-move]')) el.setAttribute('data-ss-move', '');
    });
    Array.prototype.forEach.call(slide.children, function (f) {
      if (!f.hasAttribute('data-frame-id') || f.style.bottom === '56px' || f.style.inset === '0px' || /inset:\s*0px/.test(f.getAttribute('style') || '')) return;
      if (f.querySelector('[data-ss-move]')) return;
      f.setAttribute('data-ss-move', '');
    });
    var moveis = $$('[data-ss-move]', slide);
    moveis.forEach(function (el, k) {
      el.setAttribute('data-ss-move', 'e' + k);
      var p = d.p['e' + k];
      if (p) el.style.translate = p[0] + 'px ' + p[1] + 'px';
    });
    lista.forEach(function (c) {
      c.el.setAttribute('data-ss-edit', c.chave);
      var v = d.t[c.chave];
      if (typeof v === 'string') c.el.textContent = v;
    });
    if (d.img) aplicarImagem(slide, d.img);
    return { d: d, el: slide, campos: lista };
  }

  function rotuloDe(el, txt) {
    var nivel = el.getAttribute('aria-level');
    var fs = parseFloat(el.style.fontSize) || 0;
    if (nivel === '1' || nivel === '2') return 'Título';
    if (nivel === '3') return 'Tópico';
    if (/^\[?\d{1,3}\]?$/.test(txt) || fs >= 180) return 'Número';
    if (parseFloat(el.style.letterSpacing) >= 2 || (txt.length < 40 && txt === txt.toUpperCase() && /[A-ZÀ-Ú]/.test(txt))) return 'Rótulo';
    return 'Texto';
  }

  function aplicarImagem(slide, url) {
    var area = slide.querySelector('[data-ss-img]');
    if (!area) return;
    if (url) { area.style.backgroundImage = 'url("' + url + '")'; area.classList.add('has-img'); }
    else { area.style.backgroundImage = ''; area.classList.remove('has-img'); }
  }

  var deck = salvo.slides.map(montarSlide);

  // Mantém o número do rodapé de cada slide de acordo com a posição atual
  function renumerar() {
    deck.forEach(function (s, i) {
      var nums = $$('[data-text-path]', s.el).filter(function (el) { return ehRodape(el) && /^\d{1,3}$/.test(el.textContent.trim()); });
      if (nums.length) nums[nums.length - 1].textContent = ('0' + (i + 1)).slice(-2);
    });
  }
  renumerar();

  /* ---------- Palco e navegação ---------- */
  var host = $('.ss-host'), frame = $('.ss-frame'), stage = $('.ss-stage');
  var atual = Math.min(Math.max((parseInt(params.get('slide'), 10) || 1) - 1, 0), deck.length - 1);
  var escala = 1;

  function ajustar() {
    var barra = $('.ss-stagebar').offsetHeight + $('.ss-stage-hint').offsetHeight + 28;
    var w = stage.clientWidth, h = stage.clientHeight - barra;
    if (window.matchMedia('(max-width:980px)').matches) h = window.innerHeight * 0.6;
    escala = Math.max(0.1, Math.min(w / 1920, h / 1080));
    frame.style.width = Math.round(1920 * escala) + 'px';
    frame.style.height = Math.round(1080 * escala) + 'px';
    host.style.transform = 'scale(' + escala + ')';
  }
  if (window.ResizeObserver) new ResizeObserver(ajustar).observe(stage);
  window.addEventListener('resize', ajustar);

  // Miniaturas
  var trilho = $('.ss-variants');
  function montarTrilho() {
    trilho.innerHTML = deck.map(function (_, i) {
      return '<button type="button" class="ss-thumb" data-i="' + i + '" aria-label="Slide ' + (i + 1) + '"><div class="ss-deck"></div></button>';
    }).join('');
    for (var i = 0; i < deck.length; i++) atualizarMini(i);
  }
  function atualizarMini(i) {
    var box = $('.ss-thumb[data-i="' + i + '"] .ss-deck');
    if (!box || !deck[i]) return;
    box.innerHTML = '';
    box.appendChild(copiaLimpa(deck[i].el));
  }
  montarTrilho();
  trilho.addEventListener('click', function (e) {
    var b = e.target.closest('.ss-thumb');
    if (b) irPara(+b.dataset.i);
  });

  $('.ss-pager').addEventListener('click', function (e) {
    var b = e.target.closest('[data-go]');
    if (b) irPara(atual + (+b.dataset.go));
  });
  document.addEventListener('keydown', function (e) {
    var a = document.activeElement;
    if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return; // nos campos vale o desfazer do próprio texto
    if ((e.ctrlKey || e.metaKey) && !e.altKey) {
      var tecla = e.key.toLowerCase();
      if (tecla === 'z' && !e.shiftKey) { desfazer(); e.preventDefault(); return; }
      if ((tecla === 'z' && e.shiftKey) || tecla === 'y') { refazer(); e.preventDefault(); return; }
    }
    if (selecionado && /^Arrow/.test(e.key)) {
      registrarHistorico('setas:' + atual + ':' + selecionado.getAttribute('data-ss-move'));
      var passo = e.shiftKey ? 40 : 4;
      var m = { ArrowLeft: [-passo, 0], ArrowRight: [passo, 0], ArrowUp: [0, -passo], ArrowDown: [0, passo] }[e.key];
      var p = posDe(selecionado);
      definirPos(selecionado, p[0] + m[0], p[1] + m[1]);
      gravarPos(selecionado);
      e.preventDefault();
      return;
    }
    if (e.key === 'Escape' && selecionado) { selecionar(null); return; }
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { irPara(atual + 1); e.preventDefault(); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { irPara(atual - 1); e.preventDefault(); }
  });

  function irPara(i) {
    if (i < 0 || i >= deck.length) return;
    atual = i;
    selecionar(null);
    host.innerHTML = '';
    host.appendChild(deck[i].el);
    $$('.ss-thumb').forEach(function (b) { b.setAttribute('aria-current', String(+b.dataset.i === i)); });
    var cur = $('.ss-thumb[data-i="' + i + '"]');
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    $('.ss-slidecount').textContent = 'Slide ' + (i + 1) + ' de ' + deck.length;
    $('.ss-pager-n').textContent = (i + 1) + ' / ' + deck.length;
    $('[data-go="-1"]').disabled = i === 0;
    $('[data-go="1"]').disabled = i === deck.length - 1;
    $('[data-slide="subir"]').disabled = i === 0;
    $('[data-slide="descer"]').disabled = i === deck.length - 1;
    $('[data-slide="excluir"]').disabled = deck.length === 1;
    try { history.replaceState(null, '', '?marca=' + marcaId + '&slide=' + (i + 1)); } catch (e) {}
    montarCampos();
    montarDrop();
    atualizarBotaoPos();
    if (typeof formato !== 'undefined' && formato) atualizarDica();
  }

  /* ---------- Adicionar, duplicar, reordenar e excluir slides ---------- */
  function sincronizar() {
    salvo.slides = deck.map(function (s) { return s.d; });
    renumerar();
    montarTrilho();
    salvar();
  }
  function inserir(d, pos) {
    registrarHistorico();
    deck.splice(pos, 0, montarSlide(d));
    sincronizar();
    irPara(pos);
  }

  var btnNovo = $('[data-slide="novo"]'), layouts = $('.ss-layouts');
  layouts.innerHTML = modelos.map(function (_, i) {
    return '<button type="button" class="ss-layout" data-src="' + i + '" aria-label="Novo slide com o layout ' + (i + 1) + '"><div class="ss-deck"></div></button>';
  }).join('');
  modelos.forEach(function (_, i) {
    $('.ss-layout[data-src="' + i + '"] .ss-deck', layouts).appendChild(copiaLimpa(montarSlide({ src: i, t: {}, img: '', p: {} }).el));
  });
  function abrirLayouts(abrir) {
    layouts.hidden = !abrir;
    btnNovo.setAttribute('aria-expanded', String(abrir));
    if (abrir) { var b = $('.ss-layout', layouts); if (b) b.focus(); }
  }
  layouts.addEventListener('click', function (e) {
    var b = e.target.closest('.ss-layout'); if (!b) return;
    abrirLayouts(false);
    inserir({ id: uid(), src: +b.dataset.src, t: {}, img: '', p: {} }, atual + 1);
  });
  layouts.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { e.stopPropagation(); abrirLayouts(false); btnNovo.focus(); }
  });
  document.addEventListener('click', function (e) {
    if (!layouts.hidden && !e.target.closest('.ss-layouts') && !e.target.closest('[data-slide="novo"]')) abrirLayouts(false);
  });

  $('.ss-slidetools').addEventListener('click', function (e) {
    var b = e.target.closest('[data-slide]'); if (!b || b.disabled) return;
    var acao = b.dataset.slide;
    if (acao === 'novo') { abrirLayouts(layouts.hidden); return; }
    if (acao === 'duplicar') {
      var copia = JSON.parse(JSON.stringify(deck[atual].d));
      copia.id = uid();
      inserir(copia, atual + 1);
    } else if (acao === 'subir' || acao === 'descer') {
      var j = acao === 'subir' ? atual - 1 : atual + 1;
      registrarHistorico();
      var t = deck[atual]; deck[atual] = deck[j]; deck[j] = t;
      sincronizar();
      irPara(j);
      var mesmo = $('[data-slide="' + acao + '"]');
      if (mesmo && !mesmo.disabled) mesmo.focus();
    } else if (acao === 'excluir') {
      if (deck.length === 1) return;
      registrarHistorico();
      var pos = atual;
      deck.splice(pos, 1);
      sincronizar();
      irPara(Math.min(pos, deck.length - 1));
      avisar('Slide ' + (pos + 1) + ' excluído.');
    }
  });

  var barraDesfazer = $('.ss-undo'), timerDesfazer;
  function avisar(texto) {
    $('.ss-undo-text').textContent = texto;
    barraDesfazer.hidden = false;
    clearTimeout(timerDesfazer);
    timerDesfazer = setTimeout(function () { barraDesfazer.hidden = true; }, 8000);
  }
  function esconderAviso() { clearTimeout(timerDesfazer); barraDesfazer.hidden = true; }
  $('.ss-undo-btn').addEventListener('click', function () { desfazer(); });

  /* ---------- Desfazer / Refazer (layout: posições e slides) ---------- */
  // Cada entrada guarda a ordem dos slides (as mesmas instâncias, então textos e imagens
  // continuam como estão) e uma cópia das posições de cada um.
  var historico = [], refeitos = [], MAX_HIST = 100, ultimaChave = null, ultimoT = 0;
  var btnDesfazer = $('[data-hist="desfazer"]'), btnRefazer = $('[data-hist="refazer"]');
  function retrato() {
    return { deck: deck.slice(), pos: deck.map(function (s) { return JSON.parse(JSON.stringify(s.d.p)); }), atual: atual };
  }
  // chave agrupa ações seguidas iguais (ex.: vários toques de seta no mesmo elemento) em um só passo
  function registrarHistorico(chave) {
    var agora = Date.now();
    if (chave && chave === ultimaChave && agora - ultimoT < 1000) { ultimoT = agora; return; }
    ultimaChave = chave || null; ultimoT = agora;
    historico.push(retrato());
    if (historico.length > MAX_HIST) historico.shift();
    refeitos = [];
    esconderAviso();
    atualizarHist();
  }
  function restaurar(r) {
    deck = r.deck.slice();
    deck.forEach(function (s, i) {
      s.d.p = r.pos[i];
      $$('[data-ss-move]', s.el).forEach(function (el) {
        var p = s.d.p[el.getAttribute('data-ss-move')];
        definirPos(el, p ? p[0] : 0, p ? p[1] : 0);
      });
    });
    sincronizar();
    irPara(Math.min(r.atual, deck.length - 1));
  }
  function desfazer() {
    if (!historico.length) return;
    refeitos.push(retrato());
    restaurar(historico.pop());
    ultimaChave = null; esconderAviso(); atualizarHist();
  }
  function refazer() {
    if (!refeitos.length) return;
    historico.push(retrato());
    restaurar(refeitos.pop());
    ultimaChave = null; esconderAviso(); atualizarHist();
  }
  function atualizarHist() {
    btnDesfazer.disabled = !historico.length;
    btnRefazer.disabled = !refeitos.length;
  }
  btnDesfazer.addEventListener('click', desfazer);
  btnRefazer.addEventListener('click', refazer);

  /* ---------- Mover elementos ---------- */
  var selecionado = null, arrasto = null, arrastou = false, alvoClique = null;
  var btnPos = $('.ss-pos-reset');

  function posDe(el) {
    var p = deck[atual].d.p[el.getAttribute('data-ss-move')];
    return p ? p.slice() : [0, 0];
  }
  function definirPos(el, x, y) {
    el.style.translate = (x || y) ? Math.round(x) + 'px ' + Math.round(y) + 'px' : '';
  }
  function gravarPos(el) {
    var k = el.getAttribute('data-ss-move'), d = deck[atual].d;
    var v = (el.style.translate || '').match(/-?[\d.]+/g);
    if (v && (+v[0] || +(v[1] || 0))) d.p[k] = [Math.round(+v[0]), Math.round(+(v[1] || 0))];
    else delete d.p[k];
    salvar();
    atualizarMini(atual);
    atualizarBotaoPos();
  }
  function selecionar(el) {
    if (selecionado) selecionado.classList.remove('ss-sel');
    selecionado = el;
    if (el) el.classList.add('ss-sel');
    atualizarBotaoPos();
  }
  function atualizarBotaoPos() {
    var d = deck[atual] && deck[atual].d;
    var movidos = d ? Object.keys(d.p).length : 0;
    if (selecionado) {
      btnPos.textContent = 'Restaurar posição do elemento';
      btnPos.disabled = !d.p[selecionado.getAttribute('data-ss-move')];
    } else {
      btnPos.textContent = 'Restaurar posições do slide';
      btnPos.disabled = !movidos;
    }
  }
  btnPos.addEventListener('click', function () {
    registrarHistorico();
    var d = deck[atual].d;
    var alvos = selecionado ? [selecionado] : $$('[data-ss-move]', deck[atual].el);
    alvos.forEach(function (el) { definirPos(el, 0, 0); delete d.p[el.getAttribute('data-ss-move')]; });
    salvar();
    atualizarMini(atual);
    atualizarBotaoPos();
  });

  host.addEventListener('pointerdown', function (e) {
    if (e.button > 0) return;
    var el = e.target.closest('[data-ss-move]');
    e.preventDefault(); // evita seleção de texto durante o arrasto
    var ativo = document.activeElement;
    if (ativo && ativo !== document.body && ativo.blur) ativo.blur(); // setas passam a mover o elemento
    arrastou = false;
    alvoClique = e.target; // com o ponteiro capturado, o click chega no host; guarda o alvo real
    selecionar(el);
    if (!el) return;
    var p = posDe(el);
    arrasto = { el: el, x: e.clientX, y: e.clientY, bx: p[0], by: p[1], moveu: false };
    host.setPointerCapture(e.pointerId);
  });
  host.addEventListener('pointermove', function (e) {
    if (!arrasto) return;
    var dx = (e.clientX - arrasto.x) / escala, dy = (e.clientY - arrasto.y) / escala;
    if (!arrasto.moveu && Math.abs(dx) + Math.abs(dy) < 3) return;
    if (!arrasto.moveu) registrarHistorico();
    arrasto.moveu = true;
    definirPos(arrasto.el, arrasto.bx + dx, arrasto.by + dy);
  });
  ['pointerup', 'pointercancel'].forEach(function (ev) {
    host.addEventListener(ev, function () {
      if (!arrasto) return;
      if (arrasto.moveu) { gravarPos(arrasto.el); arrastou = true; }
      arrasto = null;
    });
  });

  /* ---------- Campos do painel ---------- */
  var painel = $('.ss-fields');
  function montarCampos() {
    var lista = deck[atual].campos;
    if (!lista.length) { painel.innerHTML = '<p class="ss-fields-empty">Este slide não tem textos editáveis.</p>'; return; }
    painel.innerHTML = lista.map(function (c, k) {
      return '<label class="ss-field"><span>' + c.rotulo + ':</span><textarea rows="1" data-k="' + k + '"></textarea></label>';
    }).join('');
    $$('textarea', painel).forEach(function (ta) {
      ta.value = lista[+ta.dataset.k].el.innerText.replace(/\n$/, '');
      crescer(ta);
    });
  }
  function crescer(ta) { ta.style.height = '22px'; ta.style.height = ta.scrollHeight + 'px'; }

  painel.addEventListener('input', function (e) {
    var ta = e.target.closest('textarea'); if (!ta) return;
    var c = deck[atual].campos[+ta.dataset.k];
    c.el.textContent = ta.value;
    crescer(ta);
    registrar(c);
  });
  painel.addEventListener('focusin', function (e) {
    var ta = e.target.closest('textarea'); if (!ta) return;
    deck[atual].campos[+ta.dataset.k].el.classList.add('ss-hl');
  });
  painel.addEventListener('focusout', function (e) {
    var ta = e.target.closest('textarea'); if (!ta) return;
    var c = deck[atual].campos[+ta.dataset.k]; if (c) c.el.classList.remove('ss-hl');
  });

  // Clique (sem arrastar) num texto do slide leva ao campo dele no painel
  function editarNoPainel(el) {
    var lista = deck[atual].campos;
    for (var k = 0; k < lista.length; k++) {
      if (lista[k].el === el || el.contains(lista[k].el)) {
        var ta = painel.querySelector('textarea[data-k="' + k + '"]');
        if (ta) { ta.focus(); ta.select(); if (ta.scrollIntoView) ta.scrollIntoView({ block: 'nearest' }); }
        return;
      }
    }
  }

  var timerMini;
  function registrar(c) {
    deck[atual].d.t[c.chave] = c.el.innerText.replace(/\n$/, '');
    salvar();
    clearTimeout(timerMini);
    var i = atual;
    timerMini = setTimeout(function () { atualizarMini(i); }, 300);
  }

  var btnReset = $('.ss-reset'), timerReset;
  btnReset.addEventListener('click', function () {
    if (!btnReset.classList.contains('is-confirm')) {
      btnReset.classList.add('is-confirm');
      btnReset.textContent = 'Clique de novo para apagar as edições';
      clearTimeout(timerReset);
      timerReset = setTimeout(function () { btnReset.classList.remove('is-confirm'); btnReset.textContent = 'Restaurar modelo'; }, 4000);
      return;
    }
    try { localStorage.removeItem(CHAVE); } catch (e) {}
    location.href = location.pathname + '?marca=' + marcaId;
  });

  /* ---------- Imagem ---------- */
  var drop = $('.ss-drop'), file = $('input[type=file]', drop), erro = $('.ss-drop-error');
  function temArea(i) { return !!deck[i] && !!deck[i].el.querySelector('[data-ss-img]'); }

  function montarDrop() {
    erro.hidden = true;
    var tem = temArea(atual);
    drop.classList.toggle('is-off', !tem);
    drop.setAttribute('aria-disabled', String(!tem));
    drop.setAttribute('aria-label', tem ? 'Inserir imagem neste slide' : 'Este slide não tem área de imagem');
    var hint = $('.ss-drop-hint');
    var outro = -1;
    for (var i = 0; i < deck.length; i++) if (temArea(i)) { outro = i; break; }
    if (tem) hint.textContent = 'Arraste uma imagem ou clique para escolher';
    else if (outro >= 0) hint.innerHTML = 'Este slide não tem área de imagem. <button type="button" data-drop="ir" data-i="' + outro + '">Ir para o slide ' + (outro + 1) + '</button>';
    else hint.textContent = 'Esta apresentação não tem área de imagem.';
    var url = deck[atual].d.img;
    $('.ss-drop-empty').hidden = !!url;
    $('.ss-drop-filled').hidden = !url;
    if (url) $('.ss-drop-filled img').src = url;
  }

  drop.addEventListener('click', function (e) {
    var b = e.target.closest('[data-drop]');
    if (b && b.dataset.drop === 'ir') { irPara(+b.dataset.i); return; }
    if (drop.classList.contains('is-off')) return;
    if (b && b.dataset.drop === 'remover') { definirImagem(null); return; }
    file.click();
  });
  drop.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target === drop && !drop.classList.contains('is-off')) { e.preventDefault(); file.click(); }
  });
  host.addEventListener('click', function (e) {
    var alvo = alvoClique && host.contains(alvoClique) ? alvoClique : e.target;
    alvoClique = null;
    if (arrastou) { arrastou = false; return; }
    if (alvo.closest('[data-ss-img]')) { file.click(); return; }
    var el = alvo.closest('[data-ss-move]');
    if (el) editarNoPainel(el);
  });
  file.addEventListener('change', function () { if (file.files[0]) carregar(file.files[0]); file.value = ''; });
  ['dragenter', 'dragover'].forEach(function (ev) {
    [drop, host].forEach(function (alvo) {
      alvo.addEventListener(ev, function (e) {
        if (!temArea(atual)) return;
        e.preventDefault(); drop.classList.add('is-over');
      });
    });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    [drop, host].forEach(function (alvo) {
      alvo.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('is-over'); });
    });
  });
  [drop, host].forEach(function (alvo) {
    alvo.addEventListener('drop', function (e) {
      var f = e.dataTransfer && e.dataTransfer.files[0];
      if (f && temArea(atual)) carregar(f);
    });
  });

  function carregar(f) {
    erro.hidden = true;
    if (!/^image\/(png|jpeg|webp)$/.test(f.type)) { mostrarErro('Esse arquivo não é uma imagem. Use PNG, JPG ou WEBP.'); return; }
    if (f.size > 20 * 1024 * 1024) { mostrarErro('A imagem passa de 20 MB. Reduza o tamanho e tente de novo.'); return; }
    var img = new Image(), url = URL.createObjectURL(f), i = atual;
    img.onload = function () {
      // reduz para no máximo 1600 px para caber no salvamento do navegador
      var r = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      var c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      if (deck[i] && i === atual) definirImagem(c.toDataURL(f.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.86));
    };
    img.onerror = function () { mostrarErro('Não foi possível abrir essa imagem. Tente outro arquivo.'); };
    img.src = url;
  }
  function mostrarErro(t) { erro.textContent = t; erro.hidden = false; }
  function definirImagem(url) {
    deck[atual].d.img = url || '';
    aplicarImagem(deck[atual].el, url);
    salvar();
    atualizarMini(atual);
    montarDrop();
  }

  /* ---------- Exportar ---------- */
  var btnExp = $('.ss-export-btn'), dica = $('.ss-export-hint'), formato = $('.ss-format select');
  function atualizarDica() {
    dica.textContent = formato.value === 'pdf'
      ? 'PDF com os ' + deck.length + ' slides. Na janela de impressão, escolha "Salvar como PDF".'
      : 'PNG do slide ' + (atual + 1) + ' em 1920 × 1080.';
  }
  formato.addEventListener('change', atualizarDica);

  btnExp.addEventListener('click', function () {
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    if (formato.value === 'pdf') exportarPdf(); else exportarPng();
  });

  function copiaLimpa(slide) {
    var c = slide.cloneNode(true);
    $$('.ss-hl, .ss-sel', c).forEach(function (e) { e.classList.remove('ss-hl', 'ss-sel'); });
    return c;
  }

  function exportarPdf() {
    var box = document.getElementById('ss-print');
    if (!box) { box = document.createElement('div'); box.id = 'ss-print'; document.body.appendChild(box); }
    box.innerHTML = '';
    deck.forEach(function (s) {
      var p = document.createElement('div');
      p.className = 'ss-page ss-deck';
      p.appendChild(copiaLimpa(s.el));
      box.appendChild(p);
    });
    document.documentElement.classList.add('ss-printing');
    var fim = function () { document.documentElement.classList.remove('ss-printing'); box.innerHTML = ''; window.removeEventListener('afterprint', fim); };
    window.addEventListener('afterprint', fim);
    setTimeout(function () { window.print(); setTimeout(fim, 1000); }, 60);
  }

  var CSS_FONTES = (function () {
    var css = '';
    $$('style', document).forEach(function (st) { if (st.textContent.indexOf('@font-face') >= 0 && st.textContent.indexOf('Plus Jakarta Sans') >= 0) css = st.textContent; });
    return (css.match(/@font-face\s*{[^}]*}/g) || []).join('\n');
  })();

  // Para o PNG, a fonte precisa ir embutida. Figtree é buscada no Google Fonts e guardada em memória.
  var cssFigtree = null;
  function obterCssFonte() {
    if (!FONTE_SLIDES) return Promise.resolve(CSS_FONTES);
    if (cssFigtree !== null) return Promise.resolve(cssFigtree + CSS_FONTES);
    var fam = encodeURIComponent(FONTE_SLIDES).replace(/%20/g, '+');
    return fetch('https://fonts.googleapis.com/css2?family=' + fam + ':wght@400;500;600;700;800&display=swap')
      .then(function (r) { return r.text(); })
      .then(function (css) {
        var urls = css.match(/url\((https:[^)]+)\)/g) || [];
        return Promise.all(urls.map(function (u) {
          var link = u.slice(4, -1);
          return fetch(link).then(function (r) { return r.blob(); }).then(function (b) {
            return new Promise(function (ok) { var fr = new FileReader(); fr.onload = function () { ok([link, fr.result]); }; fr.readAsDataURL(b); });
          });
        })).then(function (pares) {
          pares.forEach(function (p) { css = css.split(p[0]).join(p[1]); });
          cssFigtree = css;
          return css + CSS_FONTES;
        });
      })
      .catch(function () { cssFigtree = ''; return CSS_FONTES; });
  }

  function exportarPng() {
    btnExp.disabled = true;
    obterCssFonte().then(gerarPng);
  }
  function gerarPng(cssFontes) {
    var c = copiaLimpa(deck[atual].el);
    c.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
    var reset = '*{box-sizing:border-box;border:0 solid;margin:0;padding:0}ul{list-style:disc}' +
      '.has-img{border:0!important;background-size:cover!important;background-position:center!important}.has-img>*{visibility:hidden}';
    var xml = new XMLSerializer().serializeToString(c);
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><style>' + cssFontes + reset + '</style>' +
      '<foreignObject x="0" y="0" width="1920" height="1080">' + xml + '</foreignObject></svg>';
    var img = new Image();
    img.onload = function () {
      setTimeout(function () { // dá tempo das fontes embutidas carregarem dentro do SVG
        var cv = document.createElement('canvas'); cv.width = 1920; cv.height = 1080;
        var ctx = cv.getContext('2d');
        ctx.drawImage(img, 0, 0);
        try {
          cv.toBlob(function (blob) {
            btnExp.disabled = false;
            if (!blob) { falhaPng(); return; }
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'sieg-' + marcaId + '-apresentacao-slide-' + (atual + 1) + '.png';
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
            btnExp.textContent = 'Exportado';
            setTimeout(function () { btnExp.textContent = 'Exportar'; }, 1800);
          }, 'image/png');
        } catch (e) { btnExp.disabled = false; falhaPng(); }
      }, 150);
    };
    img.onerror = function () { btnExp.disabled = false; falhaPng(); };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }
  function falhaPng() { dica.textContent = 'Este navegador não gerou o PNG. Use o Chrome ou exporte em PDF.'; }

  irPara(atual);
  atualizarDica();
  ajustar();
})();
</script>
