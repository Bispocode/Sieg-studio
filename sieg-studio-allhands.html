<!--
  SIEG Studio · Anúncio All Hands (SIEG Endomarketing)
  Cole este bloco inteiro em um bloco "HTML personalizado" (Gutenberg) ou no widget "HTML" (Elementor),
  numa página própria do WordPress.

  - data-gallery-url: endereço da página da galeria do SIEG Studio (link "Todos os templates").
  - Cada edição é salva no navegador como um trabalho ("All Hands · dia e mês") que aparece
    no Histórico da galeria; ?trabalho=ID reabre um trabalho. Abrir pelo card começa do modelo.
    Só vira trabalho quando algo muda de fato em relação ao modelo.
  - Desfazer / Refazer pelos botões abaixo da prévia ou por Ctrl+Z / Ctrl+Shift+Z.
  - Ao inserir uma foto, abre o ajuste de enquadramento (arrastar para posicionar, zoom pelo controle ou pela roda do mouse).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<div class="ss-ah" id="ss-ah" data-gallery-url="index.html">
  <section class="ss-editor">
    <aside class="ss-panel">
      <a class="ss-back" href="#">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6"/></svg>
        Todos os templates
      </a>
      <p class="ss-brandlabel">SIEG Endomarketing</p>
      <h2 class="ss-piece-title">Anúncio All Hands</h2>
      <p class="ss-when">Quando usar: divulgar a pauta do All Hands com horários e palestrantes.</p>

      <div class="ss-scroll">
        <fieldset class="ss-group">
          <legend>Data e horário</legend>
          <div class="ss-row">
            <label class="ss-field ss-field-sm"><span>Dia:</span><input type="number" min="1" max="31" data-k="dia"></label>
            <label class="ss-field"><span>Mês:</span><select data-k="mes"></select></label>
          </div>
          <div class="ss-row">
            <label class="ss-field ss-field-sm"><span>Ano:</span><select data-k="ano"></select></label>
            <p class="ss-semana" aria-live="polite"></p>
          </div>
          <div class="ss-row">
            <label class="ss-field"><span>Das:</span><input type="time" step="300" data-k="inicio"></label>
            <label class="ss-field"><span>às:</span><input type="time" step="300" data-k="fim"></label>
          </div>
          <ul class="ss-validacao" aria-live="polite" hidden></ul>
        </fieldset>

        <div class="ss-group-head">
          <h3>Pautas</h3>
          <button type="button" class="ss-reset">Restaurar modelo</button>
        </div>
        <p class="ss-pautas-dica">As pautas ficam sempre em ordem de horário.</p>
        <div class="ss-pautas"></div>
        <button type="button" class="ss-add-pauta">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          Adicionar pauta
        </button>
      </div>
      <div class="ss-undo" role="status" hidden>
        <span class="ss-undo-text"></span>
        <button type="button" class="ss-undo-btn">Desfazer</button>
      </div>
      <p class="ss-error" role="alert" hidden></p>

      <div class="ss-export">
        <label class="ss-format">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v12M7 12.5l5 5 5-5"/></svg>
          <span class="ss-sr">Formato do arquivo</span>
          <select>
            <option value="png">PNG</option>
            <option value="jpg">JPG</option>
          </select>
        </label>
        <button type="button" class="ss-export-btn">Exportar</button>
      </div>
      <p class="ss-export-hint"></p>
    </aside>

    <div class="ss-stage">
      <canvas class="ss-canvas" width="1080" height="1350" aria-label="Pré-visualização do anúncio All Hands"></canvas>
      <div class="ss-stagebar">
        <div class="ss-hist" role="group" aria-label="Desfazer e refazer">
          <button type="button" data-hist="desfazer" aria-label="Desfazer" title="Desfazer (Ctrl+Z)" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
          <button type="button" data-hist="refazer" aria-label="Refazer" title="Refazer (Ctrl+Shift+Z)" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
        </div>
      </div>
      <p class="ss-stage-hint">Clique numa foto da peça para inserir ou ajustar o enquadramento.</p>
    </div>
  </section>
  <input type="file" class="ss-file ss-file-hidden" accept="image/png,image/jpeg,image/webp" tabindex="-1" aria-hidden="true">

</div>

<style>
.ss-ah{
  --ss-bg:#f2f4f8;--ss-ink:#040426;--ss-ink-2:#3a3f4b;--ss-muted:#8a8f99;
  --ss-accent:#6f2abe;
  --ss-glass:linear-gradient(160deg,#f9fafc 0%,#eceff4 52%,#f7f8fa 100%);
  font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ss-ink);background:var(--ss-bg);padding:clamp(20px,3vw,48px);line-height:1.4;
  -webkit-font-smoothing:antialiased;
}
.ss-ah *,.ss-ah *::before,.ss-ah *::after{box-sizing:border-box}
.ss-ah [hidden]{display:none!important}
.ss-ah svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ss-ah button,.ss-ah input,.ss-ah select,.ss-ah textarea{font:inherit;color:inherit;letter-spacing:normal;text-transform:none;box-shadow:none;margin:0}
.ss-ah button{cursor:pointer;border:0;background:none;padding:0;border-radius:0;line-height:1.2}
.ss-ah a{text-decoration:none;color:inherit}
.ss-ah h2,.ss-ah h3,.ss-ah p{margin:0}
.ss-ah fieldset{margin:0;padding:0;border:0;min-width:0}
.ss-ah :focus-visible{outline:3px solid var(--ss-accent);outline-offset:3px}
.ss-ah .ss-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.ss-ah .ss-editor{display:grid;grid-template-columns:minmax(320px,420px) minmax(0,1fr);gap:clamp(24px,3.5vw,56px);height:min(900px,calc(100vh - 96px));min-height:640px}
.ss-ah .ss-editor>*{min-width:0;min-height:0}

.ss-ah .ss-panel{display:flex;flex-direction:column;padding:26px 22px 22px;border-radius:18px;background:var(--ss-glass);border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 1px 0 #fff,0 12px 32px rgba(18,28,60,.07)}
.ss-ah .ss-back{display:inline-flex;align-items:center;gap:4px;font-size:14px;color:var(--ss-ink-2);margin:-6px 0 16px -6px;padding:4px 8px 4px 2px;border-radius:8px;align-self:flex-start}
.ss-ah .ss-back svg{width:18px;height:18px}
.ss-ah .ss-back:hover{color:var(--ss-accent)}
.ss-ah .ss-brandlabel{font-size:15px}
.ss-ah .ss-piece-title{font-size:clamp(28px,2.4vw,40px);font-weight:400;line-height:1.12;color:var(--ss-accent);margin:6px 0 8px;letter-spacing:-.01em}
.ss-ah .ss-when{font-size:14px;color:var(--ss-ink-2);margin-bottom:18px}

.ss-ah .ss-scroll{flex:1 1 auto;overflow-y:auto;margin:0 -8px;padding:4px 8px 8px}
.ss-ah .ss-group legend,.ss-ah .ss-group-head h3{font-size:14px;font-weight:600;color:var(--ss-ink-2);margin-bottom:10px;padding:0}
.ss-ah .ss-group{margin-bottom:22px}
.ss-ah .ss-group-head{display:flex;justify-content:space-between;align-items:baseline}
.ss-ah .ss-reset{font-size:13px;color:var(--ss-muted);text-decoration:underline;text-underline-offset:3px}
.ss-ah .ss-reset:hover{color:var(--ss-accent)}
.ss-ah .ss-reset.is-confirm{color:#b42318;text-decoration:none;font-weight:600}
.ss-ah .ss-row{display:flex;gap:8px;margin-bottom:8px}
.ss-ah .ss-row>*{flex:1;min-width:0}
@media (max-width:420px){.ss-ah .ss-field{padding:0 10px;gap:6px}.ss-ah .ss-field span{font-size:13px}}
.ss-ah .ss-row .ss-field-sm{flex:0 0 112px}

.ss-ah .ss-field{display:flex;align-items:center;gap:8px;min-height:42px;padding:0 14px;border-radius:999px;background:linear-gradient(95deg,#e8eaef 0%,#f6f7f9 60%,#fafbfc 100%);border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 1px 2px rgba(18,28,60,.05);cursor:text}
.ss-ah .ss-field span{font-size:14px;flex:none}
.ss-ah .ss-field input,.ss-ah .ss-field select,.ss-ah .ss-field textarea{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:0;font-size:15px;color:var(--ss-ink-2)}
.ss-ah .ss-field select{cursor:pointer;height:40px}
.ss-ah .ss-field input{height:40px}
.ss-ah .ss-field:focus-within{box-shadow:0 0 0 2px var(--ss-accent)}
.ss-ah .ss-field-area{align-items:flex-start;border-radius:20px;padding:10px 14px}
.ss-ah .ss-field-area span{line-height:22px}
.ss-ah .ss-field-area textarea{resize:none;overflow:hidden;line-height:22px;height:22px;display:block}

.ss-ah .ss-semana{flex:1;align-self:center;margin:0;font-size:14px;color:var(--ss-ink-2)}
.ss-ah .ss-validacao{list-style:none;margin:2px 0 0;padding:10px 12px;border-radius:12px;background:#fffaeb;border:1px solid #fedf89;color:#7a2e0e;font-size:13px}
.ss-ah .ss-validacao li+li{margin-top:4px}
.ss-ah .ss-validacao li::before{content:"⚠ "}
.ss-ah .ss-pautas-dica{font-size:12px;color:var(--ss-muted);margin:-4px 0 10px}
.ss-ah .ss-pauta{background:rgba(255,255,255,.65);border:1px solid #fff;border-radius:16px;padding:12px;margin-bottom:12px}
.ss-ah .ss-pauta-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ss-ah .ss-pauta-n{font-size:13px;font-weight:700;color:var(--ss-accent)}
.ss-ah .ss-pauta-tools{display:flex;gap:2px}
.ss-ah .ss-icon-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ss-ink-2)}
.ss-ah .ss-icon-btn svg{width:17px;height:17px}
.ss-ah .ss-icon-btn:hover{background:rgba(0,0,0,.06);color:var(--ss-ink)}
.ss-ah .ss-icon-btn[disabled]{opacity:.3;cursor:default;background:none}
.ss-ah .ss-icon-btn.is-danger:hover{color:#b42318;background:#fdecea}
.ss-ah .ss-pauta .ss-field{margin-bottom:8px}
.ss-ah .ss-people-label{font-size:13px;color:var(--ss-ink-2);margin:4px 0 8px}
.ss-ah .ss-person{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ss-ah .ss-person .ss-field{flex:1;margin:0}
.ss-ah .ss-photo{flex:none;width:44px;height:44px;border-radius:50%;border:3px solid var(--ss-accent);background:#e4dcf2 center/cover no-repeat;display:grid;place-items:center;color:var(--ss-accent);overflow:hidden}
.ss-ah .ss-photo svg{width:18px;height:18px}
.ss-ah .ss-photo.has-photo svg{display:none}
.ss-ah .ss-photo:hover{filter:brightness(.95)}
.ss-ah .ss-add-person{font-size:13px;color:var(--ss-accent);display:inline-flex;align-items:center;gap:4px;padding:4px 2px}
.ss-ah .ss-add-person svg{width:15px;height:15px}
.ss-ah .ss-add-person[disabled]{opacity:.4;cursor:default}
.ss-ah .ss-add-pauta{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:14px;border:1px dashed #b9bdc8;font-size:15px;color:var(--ss-ink-2)}
.ss-ah .ss-add-pauta svg{width:18px;height:18px}
.ss-ah .ss-add-pauta:hover{border-color:var(--ss-accent);color:var(--ss-accent)}
.ss-ah .ss-add-pauta[disabled]{opacity:.4;cursor:default}
.ss-ah .ss-error{font-size:13px;color:#b42318;margin-top:8px}
.ss-ah .ss-file-hidden,.ss-ah .ss-photo input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
.ss-ah .ss-photo{position:relative;cursor:pointer}
.ss-ah .ss-photo:focus-within{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ss-accent)}
.ss-ah .ss-undo{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;padding:10px 14px;border-radius:12px;background:var(--ss-ink);color:#fff;font-size:14px}
.ss-ah .ss-undo-btn{color:#fff;font-weight:600;text-decoration:underline;text-underline-offset:3px;font-size:14px}

.ss-ah .ss-export{display:flex;align-items:center;gap:10px;padding-top:16px;flex:none}
.ss-ah .ss-format{display:flex;align-items:center;height:40px;padding:0 10px 0 8px;border-radius:999px;background:linear-gradient(95deg,#e8eaef,#f8f9fb);border:1px solid rgba(255,255,255,.95)}
.ss-ah .ss-format svg{width:16px;height:16px;color:var(--ss-muted);flex:none}
.ss-ah .ss-format select{appearance:none;-webkit-appearance:none;border:0;outline:0;background:transparent;padding:0 4px;font-size:18px;height:100%;cursor:pointer}
.ss-ah .ss-format:focus-within{box-shadow:0 0 0 2px var(--ss-accent)}
.ss-ah .ss-export-btn{height:40px;padding:0 16px;border-radius:999px;background:var(--ss-accent);color:#fff;font-size:18px}
.ss-ah .ss-export-btn:hover{filter:brightness(1.08)}
.ss-ah .ss-export-hint{font-size:12px;color:var(--ss-muted);margin-top:8px}

.ss-ah .ss-stage{overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:12px;padding:4px 4px 12px}
.ss-ah .ss-canvas{display:block;width:min(100%,560px);height:auto;border-radius:10px;box-shadow:0 18px 40px rgba(18,28,60,.12);background:#f2f4f8;cursor:default;flex:none}
.ss-ah .ss-canvas.is-photo{cursor:pointer}
.ss-ah .ss-stage-hint{font-size:13px;color:var(--ss-muted);text-align:center}
.ss-ah .ss-stagebar{display:flex;align-items:center;justify-content:center;gap:10px 18px;flex-wrap:wrap}
.ss-ah .ss-hist{display:flex;gap:2px}
.ss-ah .ss-hist button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ss-ink-2)}
.ss-ah .ss-hist button:hover{background:rgba(0,0,0,.06);color:var(--ss-ink)}
.ss-ah .ss-hist button[disabled]{opacity:.3;cursor:default;background:none}
.ss-ah .ss-hist svg{width:19px;height:19px}


@media (max-width:980px){
  .ss-ah .ss-editor{grid-template-columns:minmax(0,1fr);height:auto;min-height:0}
  .ss-ah .ss-stage{order:-1;overflow:visible}
  .ss-ah .ss-scroll{max-height:none;overflow:visible}
}
@media (prefers-reduced-motion:reduce){.ss-ah *{transition:none!important}}
</style>

  // Salvamento automático de um editor.

  // - Sem espaço no navegador, mostra um aviso fixo e oferece apagar os trabalhos mais antigos (dizendo quais).
  function criarSalvamento(o) {

    var nota = document.createElement('p');
    nota.className = 'ss-base-nota';
    nota.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Os trabalhos ficam salvos só neste navegador. Exporte para guardar.';
    o.depoisDe.parentNode.insertBefore(nota, o.depoisDe.nextSibling);

      var velhos = Trabalho.maisAntigos(id, 3);
      if (!velhos.length) {
        alerta.innerHTML = '<p><b>Não foi possível salvar este trabalho neste navegador.</b> Exporte a peça antes de sair da página.</p>';
      } else {
        alerta.innerHTML = '<p><b>O navegador ficou sem espaço e este trabalho não foi salvo.</b> Para salvar, dá para apagar ' +
          (velhos.length === 1 ? 'o trabalho mais antigo' : 'os ' + velhos.length + ' trabalhos mais antigos') + ' do Histórico:</p>' +
          '<p>' + velhos.map(function (x) { return '• ' + escapar(Trabalho.nomeDe(x)) + ' (' + dataHora(x.atualizado) + ')'; }).join('<br>') + '</p>' +
          '<p><button type="button" class="ss-base-liberar" data-liberar>Apagar ' + (velhos.length === 1 ? 'esse' : 'esses') + ' e salvar</button></p>';
      }

    }
    alerta.addEventListener('click', function (e) {
      if (!e.target.closest('[data-liberar]')) return;
      var velhos = Trabalho.maisAntigos(id, 3);
      velhos.forEach(function (x) { Trabalho.apagar(x.id); });
      agora();
      if (alerta.hidden) {
        alerta.innerHTML = '<p>Trabalho salvo. Apagados do Histórico: ' + velhos.map(function (x) { return escapar(Trabalho.nomeDe(x)); }).join(', ') + '.</p>';
        alerta.hidden = false;
        setTimeout(function () { alerta.hidden = true; }, 10000);
      }
    });
    function agora() {
      clearTimeout(timer);

      if (!id) {
        if (JSON.stringify(dados) === JSON.stringify(o.modelo())) return;
        id = Trabalho.novoId();
        o.aoCriar(id);
      }
      var r = Trabalho.gravar({ id: id, template: o.info.template, titulo: o.info.titulo, marca: o.info.marca, nome: o.nome() }, dados);

  /* ---------- Desfazer / Refazer ---------- */
  // opcoes: { retrato() -> cópia do estado, aplicar(r), registrou(), depois() }
  function criarHistorico(opcoes) {
    var pilha = [], refeitos = [], ultimaChave = null, ultimoT = 0, MAX_HIST = 100;
    var bDesfazer = $('[data-hist="desfazer"]'), bRefazer = $('[data-hist="refazer"]');
    function atualizar() { bDesfazer.disabled = !pilha.length; bRefazer.disabled = !refeitos.length; }
    // Chame ANTES de mudar o estado. chave agrupa ações seguidas iguais (digitar no mesmo campo,
    // vários toques de seta no mesmo elemento) num passo só.
    function registrar(chave) {
      var agora = Date.now();
      if (chave && chave === ultimaChave && agora - ultimoT < 1200) { ultimoT = agora; return; }
      ultimaChave = chave || null; ultimoT = agora;
      pilha.push(opcoes.retrato());
      if (pilha.length > MAX_HIST) pilha.shift();
      refeitos = [];
      atualizar();
      if (opcoes.registrou) opcoes.registrou();
    }
    function mover(de, para) {
      if (!de.length) return;
      para.push(opcoes.retrato());
      opcoes.aplicar(de.pop());
      ultimaChave = null;
      atualizar();
      if (opcoes.depois) opcoes.depois();
    }
    function desfazer() { mover(pilha, refeitos); }
    function refazer() { mover(refeitos, pilha); }
    bDesfazer.addEventListener('click', desfazer);
    bRefazer.addEventListener('click', refazer);
    document.addEventListener('keydown', function (e) {
      if (!(e.ctrlKey || e.metaKey) || e.altKey || modalAberto()) return;
      var a = document.activeElement;
      if (a && (/INPUT|TEXTAREA|SELECT/.test(a.tagName) || a.isContentEditable)) return; // nos campos vale o desfazer do próprio texto
      var k = e.key.toLowerCase();
      if (k === 'z' && !e.shiftKey) { e.preventDefault(); desfazer(); }
      else if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); refazer(); }
    });
    atualizar();
    return { registrar: registrar, desfazer: desfazer, refazer: refazer };
  }

      c.width = Math.max(1, Math.round(img.naturalWidth * r)); c.height = Math.max(1, Math.round(img.naturalHeight * r));
      var cx = c.getContext('2d');

  // Ajuste.abrir({ src, enq, aspecto, circulo, aplicar(enq, img), trocar(), remover(), erro(msg) })

  }

  canvas.addEventListener('mousemove', function (e) { canvas.classList.toggle('is-photo', !!acerto(e)); });
  canvas.addEventListener('click', function (e) { var a = acerto(e); if (a) abrirAjusteDe(a.p, a.k); });
  function acerto(e) {
    var r = canvas.getBoundingClientRect();
    var x = (e.clientX - r.left) * canvas.width / r.width, y = (e.clientY - r.top) * canvas.height / r.height;
    for (var i = 0; i < alvosFoto.length; i++) {
      var a = alvosFoto[i];
      if ((x - a.x) * (x - a.x) + (y - a.y) * (y - a.y) <= a.r * a.r) return a;
    }
    return null;
  }

  /* ---------- Exportar ---------- */
  var btnExp = $('.ss-export-btn');
  // Campos que ainda estão vazios (na peça aparece o texto de exemplo) ou com colchetes
  function pendencias() {
    var lista = [];
    st.pautas.forEach(function (p, i) {
      if (!p.titulo.trim() || temColchetes(p.titulo)) lista.push({ onde: 'Pauta ' + (i + 1) + ' · Título', texto: p.titulo.trim() ? p.titulo : 'vazio (aparece "Título da pauta")', alvo: '.ss-pauta[data-p="' + i + '"] textarea[data-f="titulo"]' });
      p.pessoas.forEach(function (pe, k) {
        if (!pe.nome.trim() || temColchetes(pe.nome)) lista.push({ onde: 'Pauta ' + (i + 1) + ' · Palestrante ' + (k + 1), texto: pe.nome.trim() ? pe.nome : 'vazio (aparece "Nome do palestrante")', alvo: '.ss-pauta[data-p="' + i + '"] .ss-person[data-k="' + k + '"] input[data-f="nome"]' });
      });
    });
    return lista;
  }
  btnExp.addEventListener('click', function () {
    conferirExport(pendencias(), function (p) {
      var el = $(p.alvo);
      if (el) { el.scrollIntoView({ block: 'center' }); el.focus(); }
    }, exportar);
  });
  function exportar() {
    var fmt = $('.ss-format select').value;
    desenhar();
    canvas.toBlob(function (blob) {
      if (!blob) return;
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'sieg-all-hands-' + (st.dia || '') + '-' + String(st.mes || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '') + '.' + fmt;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      btnExp.textContent = 'Exportado';
      setTimeout(function () { btnExp.textContent = 'Exportar'; }, 1800);
    }, fmt === 'jpg' ? 'image/jpeg' : 'image/png', 0.92);
  }

  montarPautas();
  desenhar();
  if (document.fonts && document.fonts.load) {
    Promise.all(['400', '700'].map(function (w) { return document.fonts.load(w + ' 40px Figtree'); })).then(agendar, agendar);
    document.fonts.ready.then(agendar);
  }
})();
</script>
