<!--
  SIEG Studio · Resumo semanal de atualizações (SIEG Institucional)
  Cole este bloco inteiro em um bloco "HTML personalizado" (Gutenberg) ou no widget "HTML" (Elementor),
  numa página própria do WordPress.

  - data-gallery-url: endereço da página da galeria do SIEG Studio (link "Todos os templates").
  - Cada edição é salva no navegador como um trabalho ("Resumo semanal · datas") que aparece
    no Histórico da galeria; ?trabalho=ID reabre um trabalho. Abrir pelo card começa do modelo.
    Só vira trabalho quando algo muda de fato em relação ao modelo.
  - Desfazer / Refazer pelos botões abaixo da prévia ou por Ctrl+Z / Ctrl+Shift+Z.
  - A peça tem 1080 px de largura; a altura cresce quando há muitos itens.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<div class="ss-rs" id="ss-rs" data-gallery-url="index.html">
  <section class="ss-editor">
    <aside class="ss-panel">
      <a class="ss-back" href="#">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6"/></svg>
        Todos os templates
      </a>
      <p class="ss-brandlabel">SIEG Institucional</p>
      <h2 class="ss-piece-title">Resumo semanal</h2>
      <p class="ss-when">Quando usar: contar ao time o que foi lançado, o que vem por aí e os comunicados da semana.</p>

      <div class="ss-scroll">
        <fieldset class="ss-group">
          <legend>Semana</legend>
          <div class="ss-row">
            <label class="ss-field"><span>De:</span><input type="date" data-k="inicio"></label>
            <label class="ss-field"><span>a:</span><input type="date" data-k="fim"></label>
          </div>
          <ul class="ss-validacao" aria-live="polite" hidden></ul>
        </fieldset>

        <div class="ss-group-head">
          <h3>Seções</h3>
          <button type="button" class="ss-reset">Restaurar modelo</button>
        </div>
        <p class="ss-dica">Desmarque uma seção para tirá-la da peça.</p>
        <div class="ss-secoes"></div>

        <fieldset class="ss-group ss-release">
          <legend>Release</legend>
          <div class="ss-row">
            <label class="ss-check"><input type="checkbox" data-r="ativo"><span>Mostrar na peça</span></label>
          </div>
          <div class="ss-row">
            <label class="ss-field"><span>Publicada em:</span><input type="date" data-r="data"></label>
          </div>
        </fieldset>
      </div>
      <div class="ss-undo" role="status" hidden>
        <span class="ss-undo-text"></span>
        <button type="button" class="ss-undo-btn">Desfazer</button>
      </div>

      <div class="ss-export">
        <label class="ss-format">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v12M7 12.5l5 5 5-5"/></svg>
          <span class="ss-sr">Formato do arquivo</span>
          <select>
            <option value="png">PNG</option>
            <option value="jpg">JPG</option>
          </select>
        </label>
        <button type="button" class="ss-export-btn">Exportar</button>
      </div>
      <p class="ss-export-hint"></p>
    </aside>

    <div class="ss-stage">
      <canvas class="ss-canvas" width="1080" height="1350" aria-label="Pré-visualização do resumo semanal"></canvas>
      <div class="ss-stagebar">
        <div class="ss-hist" role="group" aria-label="Desfazer e refazer">
          <button type="button" data-hist="desfazer" aria-label="Desfazer" title="Desfazer (Ctrl+Z)" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
          <button type="button" data-hist="refazer" aria-label="Refazer" title="Refazer (Ctrl+Shift+Z)" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
        </div>
      </div>
    </div>
  </section>
  <datalist id="ss-rs-grupos">
    <option value="Novidade"></option>
    <option value="Correção"></option>
    <option value="Melhoria"></option>
    <option value="Alerta"></option>
    <option value="Aviso"></option>
  </datalist>
</div>

<style>
.ss-rs{
  --ss-bg:#f2f4f8;--ss-ink:#040426;--ss-ink-2:#3a3f4b;--ss-muted:#8a8f99;
  --ss-accent:#005fe9;

  font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ss-ink);background:var(--ss-bg);padding:clamp(20px,3vw,48px);line-height:1.4;

}
.ss-rs *,.ss-rs *::before,.ss-rs *::after{box-sizing:border-box}
.ss-rs [hidden]{display:none!important}
.ss-rs svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ss-rs button,.ss-rs input,.ss-rs select,.ss-rs textarea{font:inherit;color:inherit;letter-spacing:normal;text-transform:none;box-shadow:none;margin:0}
.ss-rs button{cursor:pointer;border:0;background:none;padding:0;border-radius:0;line-height:1.2}
.ss-rs a{text-decoration:none;color:inherit}
.ss-rs h2,.ss-rs h3,.ss-rs p{margin:0}
.ss-rs fieldset{margin:0;padding:0;border:0;min-width:0}
.ss-rs :focus-visible{outline:3px solid var(--ss-accent);outline-offset:3px}
.ss-rs .ss-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.ss-rs .ss-editor{display:grid;grid-template-columns:minmax(320px,440px) minmax(0,1fr);gap:clamp(24px,3.5vw,56px);height:min(900px,calc(100vh - 96px));min-height:640px}
.ss-rs .ss-editor>*{min-width:0;min-height:0}

.ss-rs .ss-panel{display:flex;flex-direction:column;padding:26px 22px 22px;border-radius:18px;background:var(--ss-glass);border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 1px 0 #fff,0 12px 32px rgba(18,28,60,.07)}
.ss-rs .ss-back{display:inline-flex;align-items:center;gap:4px;font-size:14px;color:var(--ss-ink-2);margin:-6px 0 16px -6px;padding:4px 8px 4px 2px;border-radius:8px;align-self:flex-start}
.ss-rs .ss-back svg{width:18px;height:18px}
.ss-rs .ss-back:hover{color:var(--ss-accent)}
.ss-rs .ss-brandlabel{font-size:15px}
.ss-rs .ss-piece-title{font-size:clamp(28px,2.4vw,40px);font-weight:400;line-height:1.12;color:var(--ss-accent);margin:6px 0 8px;letter-spacing:-.01em}
.ss-rs .ss-when{font-size:14px;color:var(--ss-ink-2);margin-bottom:18px}

.ss-rs .ss-scroll{flex:1 1 auto;overflow-y:auto;margin:0 -8px;padding:4px 8px 8px}
.ss-rs .ss-group legend,.ss-rs .ss-group-head h3{font-size:14px;font-weight:600;color:var(--ss-ink-2);margin-bottom:10px;padding:0}
.ss-rs .ss-group{margin-bottom:22px}
.ss-rs .ss-group-head{display:flex;justify-content:space-between;align-items:baseline}
.ss-rs .ss-reset{font-size:13px;color:var(--ss-muted);text-decoration:underline;text-underline-offset:3px}
.ss-rs .ss-reset:hover{color:var(--ss-accent)}
.ss-rs .ss-reset.is-confirm{color:#b42318;text-decoration:none;font-weight:600}
.ss-rs .ss-row{display:flex;gap:8px;margin-bottom:8px}
.ss-rs .ss-row>*{flex:1;min-width:0}
@media (max-width:420px){.ss-rs .ss-field{padding:0 10px;gap:6px}.ss-rs .ss-field span{font-size:13px}.ss-rs .ss-item-pe .ss-field span{display:none}.ss-rs .ss-item-pe{gap:0}.ss-rs .ss-item-pe .ss-icon-btn{width:28px}.ss-rs .ss-item-pe .ss-field{padding:0 10px 0 12px}.ss-rs .ss-grupo{padding:8px}.ss-rs .ss-secao{padding:10px}}

.ss-rs .ss-field{display:flex;align-items:center;gap:8px;min-height:42px;padding:0 14px;border-radius:999px;background:linear-gradient(95deg,#e8eaef 0%,#f6f7f9 60%,#fafbfc 100%);border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 1px 2px rgba(18,28,60,.05);cursor:text}
.ss-rs .ss-field span{font-size:14px;flex:none}
.ss-rs .ss-field input,.ss-rs .ss-field textarea{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:0;font-size:15px;color:var(--ss-ink-2)}
.ss-rs .ss-field input{height:40px}
.ss-rs .ss-field input[type=date]{width:100%;min-width:0}
.ss-rs .ss-field:focus-within{box-shadow:0 0 0 2px var(--ss-accent)}
.ss-rs .ss-field-area{align-items:flex-start;border-radius:20px;padding:10px 14px}
.ss-rs .ss-field-area textarea{resize:none;overflow:hidden;line-height:22px;height:22px;display:block}
.ss-rs .ss-check{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ss-ink-2);cursor:pointer}
.ss-rs .ss-check input{width:18px;height:18px;margin:0;accent-color:var(--ss-accent);cursor:pointer}

.ss-rs .ss-validacao{list-style:none;margin:2px 0 0;padding:10px 12px;border-radius:12px;background:#fffaeb;border:1px solid #fedf89;color:#7a2e0e;font-size:13px}

.ss-rs .ss-dica{font-size:12px;color:var(--ss-muted);margin:-4px 0 10px}

.ss-rs .ss-secao{border-radius:16px;border:2px solid var(--borda);background:var(--fundo);padding:12px;margin-bottom:12px}

.ss-rs .ss-secao.is-off .ss-pilula{background:#b9bdc8}
.ss-rs .ss-secao-corpo{margin-top:10px}
.ss-rs .ss-grupo{background:rgba(255,255,255,.75);border:1px solid #fff;border-radius:12px;padding:10px;margin-bottom:8px}
.ss-rs .ss-grupo-head{display:flex;align-items:center;gap:6px;margin-bottom:8px}

.ss-rs .ss-icon-btn.is-danger:hover{color:#b42318;background:#fdecea}
.ss-rs .ss-add{font-size:13px;color:var(--ss-accent);display:inline-flex;align-items:center;gap:4px;padding:6px 2px 0}
.ss-rs .ss-add svg{width:15px;height:15px}
.ss-rs .ss-add[disabled]{opacity:.4;cursor:default}
.ss-rs .ss-add-grupo{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;height:38px;border-radius:12px;border:1px dashed #b9bdc8;font-size:14px;color:var(--ss-ink-2)}
.ss-rs .ss-add-grupo svg{width:16px;height:16px}
.ss-rs .ss-add-grupo:hover{border-color:var(--ss-accent);color:var(--ss-accent)}
.ss-rs .ss-add-grupo[disabled]{opacity:.4;cursor:default}
.ss-rs .ss-undo{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;padding:10px 14px;border-radius:12px;background:var(--ss-ink);color:#fff;font-size:14px}
.ss-rs .ss-undo-btn{color:#fff;font-weight:600;text-decoration:underline;text-underline-offset:3px;font-size:14px}

.ss-rs .ss-export{display:flex;align-items:center;gap:10px;padding-top:16px;flex:none}
.ss-rs .ss-format{display:flex;align-items:center;height:40px;padding:0 10px 0 8px;border-radius:999px;background:linear-gradient(95deg,#e8eaef,#f8f9fb);border:1px solid rgba(255,255,255,.95)}
.ss-rs .ss-format svg{width:16px;height:16px;color:var(--ss-muted);flex:none}
.ss-rs .ss-format select{appearance:none;-webkit-appearance:none;border:0;outline:0;background:transparent;padding:0 4px;font-size:18px;height:100%;cursor:pointer}
.ss-rs .ss-format:focus-within{box-shadow:0 0 0 2px var(--ss-accent)}
.ss-rs .ss-export-btn{height:40px;padding:0 16px;border-radius:999px;background:var(--ss-accent);color:#fff;font-size:18px}
.ss-rs .ss-export-btn:hover{filter:brightness(1.08)}
.ss-rs .ss-export-hint{font-size:12px;color:var(--ss-muted);margin-top:8px}

.ss-rs .ss-stage{overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:12px;padding:4px 4px 12px}
.ss-rs .ss-canvas{display:block;width:min(100%,560px);height:auto;border-radius:10px;box-shadow:0 18px 40px rgba(18,28,60,.12);background:#fbfcfe;flex:none}
.ss-rs .ss-stagebar{display:flex;align-items:center;justify-content:center;gap:10px 18px;flex-wrap:wrap}
.ss-rs .ss-hist{display:flex;gap:2px}
.ss-rs .ss-hist button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ss-ink-2)}
.ss-rs .ss-hist button:hover{background:rgba(0,0,0,.06);color:var(--ss-ink)}
.ss-rs .ss-hist button[disabled]{opacity:.3;cursor:default;background:none}
.ss-rs .ss-hist svg{width:19px;height:19px}

@media (max-width:980px){
  .ss-rs .ss-editor{grid-template-columns:minmax(0,1fr);height:auto;min-height:0}
  .ss-rs .ss-stage{order:-1;overflow:visible}
  .ss-rs .ss-scroll{max-height:none;overflow:visible}
}
@media (prefers-reduced-motion:reduce){.ss-rs *{transition:none!important}}
</style>

      ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI - 0.8, Math.PI + 0.8); ctx.stroke();
    });
    ctx.fillStyle = AZUL; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    espacado(selo, MX + 34, 70, 2.6);

    // Período
    var periodo = (br(st.inicio) || 'dd/mm/aaaa') + ' a ' + (br(st.fim) || 'dd/mm/aaaa');
    ctx.font = '700 17px ' + FONTE;
    var pw = ctx.measureText(periodo).width + 30;
    retRed(W - MX - pw, 51, pw, 35, 17.5); ctx.fillStyle = '#e9f1fc'; ctx.fill();
    ctx.strokeStyle = '#c9d6ea'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillStyle = TINTA; ctx.textBaseline = 'middle';
    ctx.fillText(periodo, W - MX - pw + 15, 69);

    // Título
    ctx.textBaseline = 'alphabetic'; ctx.font = '800 64px ' + FONTE; ctx.fillStyle = AZUL;
    ctx.fillText('Resumo Semanal', MX - 2, 175);
    ctx.fillText('de ', MX - 2, 250);
    var dw = ctx.measureText('de ').width;
    ctx.fillStyle = AZUL_CLARO; ctx.fillText('Atualizações', MX - 2 + dw, 250);
    ctx.fillStyle = '#dde3ec'; ctx.fillRect(MX, 278, CW, 2);
  }

  var LH = 26; // altura de cada linha de item
  function cartao(s, si, y0) {
    var c = SECOES[s.tipo], x0 = MX, xi = MX + 20, xd = W - MX - 28;
    var linhasAte = [], y = y0 + 16;
    // primeiro mede para saber a altura do cartão; depois desenha
    var plano = [];
    y += 34 + 10;
    s.grupos.forEach(function (g, gi) {
      if (gi > 0) y += 18; // linha separadora entre grupos
      var pg = { g: g, gi: gi, y: y, itens: [] };
      y += 25 + 6;
      g.itens.forEach(function (it, ii) {
        ctx.font = '400 15.5px ' + FONTE; var dataTxt = br(it.data);
        var dwid = dataTxt ? ctx.measureText(dataTxt).width + 28 : 0;
        ctx.font = '400 18px ' + FONTE;
        var linhas = quebrar(it.texto || 'Descreva a atualização', xd - (xi + 18) - dwid, 2);
        if (cortou) cortes[si + ':' + gi + ':' + ii] = true;
        pg.itens.push({ it: it, y: y, linhas: linhas, data: dataTxt });
        y += linhas.length * LH + 12;
      });
      pg.fim = y;
      plano.push(pg);
    });
    var y1 = y + 10;
    if (seco) return y1;

    retRed(x0 + 1.25, y0 + 1.25, CW - 2.5, y1 - y0 - 2.5, 16);
    ctx.fillStyle = c.fundo; ctx.fill();
    ctx.strokeStyle = c.borda; ctx.lineWidth = 2.5; ctx.stroke();
    pilula(xi, y0 + 16, 34, c.nome, '700 17px ' + FONTE, '#fff', c.forte, null, 14);

    plano.forEach(function (pg) {
      if (pg.gi > 0) { ctx.fillStyle = c.linha; ctx.fillRect(xi, pg.y - 11, xd + 8 - xi, 1.5); }
      var nome = pg.g.nome || 'Grupo';
      ctx.globalAlpha = pg.g.nome ? 1 : 0.45;
      pilula(xi, pg.y, 25, nome, '500 15px ' + FONTE, c.sub, c.subFundo, c.subBorda, 10);
      ctx.globalAlpha = 1;
      pg.itens.forEach(function (pi) {
        var meio = pi.y + 6 + LH / 2;
        ctx.fillStyle = c.forte; ctx.beginPath(); ctx.arc(xi + 4, meio, 4, 0, Math.PI * 2); ctx.fill();
        ctx.font = '400 18px ' + FONTE; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillStyle = pi.it.texto ? TEXTO : 'rgba(31,36,51,.35)';
        pi.linhas.forEach(function (l, k) { ctx.fillText(l, xi + 18, meio + 1 + k * LH); });
        if (pi.data) {
          ctx.font = '400 15.5px ' + FONTE; ctx.fillStyle = CINZA; ctx.textAlign = 'right';
          ctx.fillText(pi.data, xd, meio + 1);
          ctx.textAlign = 'left';
        }
      });
    });
    return y1;
  }

  function release(y0) {
    var h = 80;
    if (seco) return y0 + h;
    retRed(MX + 1, y0 + 1, CW - 2, h - 2, 16);
    ctx.fillStyle = '#ebf3fc'; ctx.fill();
    ctx.strokeStyle = '#8fb5f4'; ctx.lineWidth = 2; ctx.stroke();
    pilula(MX + 20, y0 + (h - 34) / 2, 34, 'Release', '700 17px ' + FONTE, '#fff', AZUL, null, 14);
    // "Publicada  dd/mm/aaaa"
    var data = br(st.release.data) || 'dd/mm/aaaa';
    ctx.font = '700 21px ' + FONTE; var w1 = ctx.measureText('Publicada').width;
    ctx.font = '400 21px ' + FONTE; var w2 = ctx.measureText(data).width;
    var bw = w1 + 14 + w2 + 48, bx = W - MX - 24 - bw, by = y0 + (h - 46) / 2;
    retRed(bx, by, bw, 46, 10); ctx.fillStyle = AZUL; ctx.fill();
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
    ctx.font = '700 21px ' + FONTE; ctx.fillText('Publicada', bx + 24, by + 24);
    ctx.font = '400 21px ' + FONTE; ctx.fillStyle = st.release.data ? '#cfe0fb' : 'rgba(207,224,251,.5)';
    ctx.fillText(data, bx + 24 + w1 + 14, by + 24);
    return y0 + h;
  }

  // Marca no painel os itens cujo texto não coube e está sendo cortado na peça
  var cortes = {};
  function marcarCortes() {
    $$('.ss-base-corte', lista).forEach(function (el) { el.remove(); });
    Object.keys(cortes).forEach(function (k) {
      var p = k.split(':');
      var alvo = $('.ss-secao[data-s="' + p[0] + '"] .ss-grupo[data-g="' + p[1] + '"] .ss-item[data-i="' + p[2] + '"] .ss-field-area', lista);
      if (!alvo) return;
      var aviso = document.createElement('p');
      aviso.className = 'ss-base-corte';
      aviso.textContent = 'Texto longo: está sendo cortado na peça';
      alvo.parentNode.insertBefore(aviso, alvo.nextSibling);
    });
  }

  var pendente = false;
  function agendar() {
    if (pendente) return;
    pendente = true;
    requestAnimationFrame(function () { pendente = false; desenhar(); });
  }
  function desenhar() {
    var H = compor(true);
    if (canvas.height !== H) canvas.height = H;
    compor(false, H);
    marcarCortes();
    $('.ss-export-hint').textContent = 'Peça em 1080 × ' + H + ' px' + (H > MIN_H ? ', a altura cresce com o número de itens.' : '.');
  }

  /* ---------- Exportar ---------- */
  var btnExp = $('.ss-export-btn');
  // Campos ainda vazios (na peça aparece o texto de exemplo) ou com colchetes
  function pendencias() {
    var lista = [];
    if (!st.inicio || !st.fim) lista.push({ onde: 'Semana', texto: 'sem data (aparece "dd/mm/aaaa")', alvo: '[data-k="' + (st.inicio ? 'fim' : 'inicio') + '"]' });
    st.secoes.forEach(function (s, si) {
      if (!s.ativo) return;
      var c = SECOES[s.tipo], sec = '.ss-secao[data-s="' + si + '"] ';
      s.grupos.forEach(function (g, gi) {
        var gr = sec + '.ss-grupo[data-g="' + gi + '"] ';
        if (!g.nome.trim() || temColchetes(g.nome)) lista.push({ onde: c.nome + ' · Grupo ' + (gi + 1), texto: g.nome.trim() ? g.nome : 'sem nome (aparece "Grupo")', alvo: gr + 'input[data-f="nome"]' });
        g.itens.forEach(function (it, ii) {
          if (!it.texto.trim() || temColchetes(it.texto)) lista.push({ onde: c.nome + ' · ' + (g.nome || 'Grupo ' + (gi + 1)) + ' · Item ' + (ii + 1), texto: it.texto.trim() ? it.texto : 'vazio (aparece "Descreva a atualização")', alvo: gr + '.ss-item[data-i="' + ii + '"] textarea' });
        });
      });
    });
    if (st.release.ativo && !st.release.data) lista.push({ onde: 'Release', texto: 'sem data (aparece "dd/mm/aaaa")', alvo: '[data-r="data"]' });
    return lista;
  }
  btnExp.addEventListener('click', function () {
    conferirExport(pendencias(), function (p) {
      var el = $(p.alvo);
      if (el) { el.scrollIntoView({ block: 'center' }); el.focus(); }
    }, exportar);
  });
  function exportar() {
    var fmt = $('.ss-format select').value;
    desenhar();
    canvas.toBlob(function (blob) {
      if (!blob) return;
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'sieg-resumo-semanal-' + (st.inicio || 'semana') + '.' + fmt;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      btnExp.textContent = 'Exportado';
      setTimeout(function () { btnExp.textContent = 'Exportar'; }, 1800);
    }, fmt === 'jpg' ? 'image/jpeg' : 'image/png', 0.92);
  }

  preencherTopo();
  montar();
  desenhar();
  if (document.fonts && document.fonts.load) {
    Promise.all(['400', '500', '700', '800'].map(function (w) { return document.fonts.load(w + ' 40px Figtree'); })).then(agendar, agendar);
    document.fonts.ready.then(agendar);
  }
})();
</script>
